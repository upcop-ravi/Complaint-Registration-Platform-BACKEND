<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | JanDarwaarPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <nav class="navbar navbar-dark bg-slate-950 border-b border-cyan-900/50 py-3 mb-8">
            <div class="container flex justify-between items-center">
                <a class="navbar-brand font-black text-orange-500 tracking-tighter" href="index.html">
                    <i class="fas fa-microchip mr-2 animate-pulse"></i> JanDarwaar<span class="text-white opacity-50">Portal</span>
                </a>
                <div class="flex items-center gap-10">
                    <div class="hidden xl:flex gap-6 uppercase text-[10px] tracking-[0.2em] font-bold">
                        <a href="index.html" class="text-slate-400 hover:text-orange-500 transition">Home</a>
                        <a href="report.html" class="text-slate-400 hover:text-orange-500 transition">Report Incident</a>
                        <a href="status.html" class="text-slate-400 hover:text-orange-500 transition">Track Status</a>
                        <a href="admin.html" class="text-orange-500 hover:text-white transition">Admin Dashboard</a>
                        <a href="contact.html" class="text-slate-400 hover:text-orange-500 transition">Help/Contact</a>
                    </div>
                    <div class="flex gap-4 text-[10px] uppercase tracking-widest text-slate-500">
                        <button id="theme-toggle" class="mr-4 text-slate-400 hover:text-orange-500 transition">
                            <i id="theme-icon" class="fas fa-moon"></i>
                        </button>
                        <div class="hidden md:flex items-center gap-4">
                            <span><i class="fas fa-satellite-dish mr-1 text-orange-500"></i> Uplink: Active</span>
                            <span class="text-slate-300">2026-05-05</span>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4">
            <div class="glass-card p-12 text-center">
                <h1 class="text-4xl font-black neon-text mb-6">ADMIN DASHBOARD</h1>
                <p class="text-slate-400 mb-8">Access restricted. Unauthorized access attempts are logged.</p>
                <div class="max-w-md mx-auto bg-slate-900/50 p-8 rounded-2xl border border-red-500/20">
                    <i class="fas fa-user-shield text-5xl text-red-500 mb-6"></i>
                    <p class="text-xs uppercase tracking-widest text-slate-500">Authentication Required</p>
                </div>
                <a href="index.html" class="inline-block mt-10 text-[10px] font-bold uppercase tracking-widest text-orange-500 hover:text-white transition">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
