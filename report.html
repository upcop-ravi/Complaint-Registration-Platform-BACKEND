<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident | JanDarwaarPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <nav class="navbar navbar-dark bg-slate-950 border-b border-cyan-900/50 py-3 mb-8">
            <div class="container flex justify-between items-center">
                <a class="navbar-brand font-black text-orange-500 tracking-tighter" href="index.html">
                    <i class="fas fa-microchip mr-2 animate-pulse"></i> JanDarwaar<span
                        class="text-white opacity-50">Portal</span>
                </a>
                <div class="flex items-center gap-10">
                    <div class="hidden xl:flex gap-6 uppercase text-[10px] tracking-[0.2em] font-bold">
                        <a href="index.html" class="text-slate-400 hover:text-orange-500 transition">Home</a>
                        <a href="report.html" class="text-orange-500 hover:text-white transition">Report Incident</a>
                        <a href="status.html" class="text-slate-400 hover:text-orange-500 transition">Track Status</a>
                        <a href="admin.html" class="text-slate-400 hover:text-orange-500 transition">Admin Dashboard</a>
                        <a href="contact.html" class="text-slate-400 hover:text-orange-500 transition">Help/Contact</a>
                    </div>
                    <div class="flex gap-4 text-[10px] uppercase tracking-widest text-slate-500">
                        <button id="theme-toggle" class="mr-4 text-slate-400 hover:text-orange-500 transition">
                            <i id="theme-icon" class="fas fa-moon"></i>
                        </button>
                        <div class="hidden md:flex items-center gap-4">
                            <span><i class="fas fa-satellite-dish mr-1 text-orange-500"></i> Uplink: Active</span>
                            <span class="text-slate-300">2026-05-05</span>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4 pb-20">
            <div class="glass-card p-8 md:p-12 max-w-4xl mx-auto">
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-black neon-text mb-2 text-orange-500">INCIDENT REPORTING FORM</h1>
                    <p class="text-slate-400 text-sm">Please provide accurate details to help us serve you better.</p>
                </div>

                <form id="incidentForm" class="row g-4 text-start">
                    <div class="col-md-6">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mobile Number *</label>
                        <input type="tel" class="form-control" placeholder="10-digit mobile number" required
                            pattern="[0-9]{10}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="example@email.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Incident Type *</label>
                        <select class="form-select" required>
                            <option value="" selected disabled>Select Type</option>
                            <option value="theft">Theft / Robbery</option>
                            <option value="harassment">Harassment</option>
                            <option value="accident">Traffic Accident</option>
                            <option value="cyber">Cyber Crime</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Incident Location *</label>
                        <input type="text" class="form-control" placeholder="Exact address or landmark" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Detailed Description *</label>
                        <textarea class="form-control" rows="4" placeholder="Describe the incident in detail..."
                            required></textarea>
                    </div>

                    <div class="col-12 mt-10 flex gap-4">
                        <button type="submit"
                            class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-xl transition-all hover:scale-105 shadow-lg shadow-orange-500/20">
                            Submit Report
                        </button>
                        <button type="reset"
                            class="bg-transparent border border-slate-700 hover:border-slate-500 text-slate-400 font-bold py-3 px-8 rounded-xl transition-all">
                            Clear Form
                        </button>
                    </div>
                </form>

                <div class="mt-12 pt-8 border-t border-white/5">
                    <a href="index.html"
                        class="inline-block text-[10px] font-bold uppercase tracking-widest text-orange-500 hover:text-white transition">
                        <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>

</html>
