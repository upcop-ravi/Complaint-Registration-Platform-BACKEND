<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanDarwaarPortal | Pro Edition</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="main-container">
        <nav class="navbar navbar-dark bg-slate-950 border-b border-cyan-900/50 py-3 mb-8">
            <div class="container flex justify-between items-center">
                <a class="navbar-brand font-black text-orange-500 tracking-tighter" href="#">
                    <i class="fas fa-microchip mr-2 animate-pulse"></i> JanDarwaar<span class="text-white opacity-50">Portal</span>
                </a>

                <div class="flex items-center gap-10">
                    <!-- Navigation Options -->
                    <div class="hidden xl:flex gap-6 uppercase text-[10px] tracking-[0.2em] font-bold">
                        <a href="index.html" class="text-orange-500 hover:text-white transition">Home</a>
                        <a href="report.html" class="text-slate-400 hover:text-orange-500 transition">Report Incident</a>
                        <a href="status.html" class="text-slate-400 hover:text-orange-500 transition">Track Status</a>
                        <a href="admin.html" class="text-slate-400 hover:text-orange-500 transition">Admin Dashboard</a>
                        <a href="contact.html" class="text-slate-400 hover:text-orange-500 transition">Help/Contact</a>
                    </div>

                    <div class="flex gap-4 text-[10px] uppercase tracking-widest text-slate-500">
                        <button id="theme-toggle" class="mr-4 text-slate-400 hover:text-orange-500 transition">
                            <i id="theme-icon" class="fas fa-moon"></i>
                        </button>
                        <div class="hidden md:flex items-center gap-4">
                            <span><i class="fas fa-satellite-dish mr-1 text-orange-500"></i> Uplink: Active</span>
                            <span class="text-slate-300">2026-05-05</span>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div class="glass-card p-8">
                    <h6 class="text-[10px] font-bold uppercase tracking-[0.3em] text-orange-500 mb-6">Core Stability</h6>
                    <div class="flex items-baseline gap-2 mb-2">
                        <h2 class="text-6xl font-mono font-black neon-text">98.2</h2>
                        <span class="text-orange-600 font-bold">%</span>
                    </div>
                    <div class="mt-8">
                        <div class="flex justify-between text-[10px] mb-2 uppercase text-slate-400">
                            <span>Flux Capacitor</span>
                            <span class="text-orange-500">Stable</span>
                        </div>
                        <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-orange-600 to-orange-400" style="width: 98%"></div>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-8 md:col-span-2">
                    <div class="flex justify-between items-center mb-6">
                        <h6 class="text-[10px] font-bold uppercase tracking-[0.3em] text-purple-400">Field Analysis</h6>
                        <span
                            class="bg-purple-500/10 text-purple-400 text-[9px] px-2 py-1 rounded border border-purple-500/20">LIVE
                            WAVEFORM</span>
                    </div>
                    <div style="height: 180px;">
                        <canvas id="gravityChart"></canvas>
                    </div>
                </div>

                <div class="md:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
                    <button
                        class="glass-card py-4 text-[10px] font-black uppercase tracking-widest text-orange-500 hover:bg-orange-500/10">
                        <i class="fas fa-sync mr-2"></i> Calibrate
                    </button>
                    <button
                        class="glass-card py-4 text-[10px] font-black uppercase tracking-widest text-orange-400 hover:bg-orange-500/10">
                        <i class="fas fa-arrow-up mr-2"></i> Lift Off
                    </button>
                    <button
                        class="glass-card py-4 text-[10px] font-black uppercase tracking-widest text-yellow-500 hover:bg-yellow-500/10">
                        <i class="fas fa-pause mr-2"></i> Suspend
                    </button>
                    <button
                        class="glass-card py-4 text-[10px] font-black uppercase tracking-widest text-red-500 hover:bg-red-500/10 border-red-500/30">
                        <i class="fas fa-power-off mr-2"></i> E-Stop
                    </button>
                </div>
            </div>
        </div>

        <div class="fixed bottom-8 right-8 group">
            <div id="chat-win" class="hidden absolute bottom-20 right-0 w-80 glass-card p-4 mb-2 animate-bounce-in">
                <p class="text-[10px] text-orange-500 font-bold mb-2">SYSTEM ASSISTANT</p>
                <div class="bg-slate-900/50 p-3 rounded-xl text-xs text-slate-300 border border-white/5">
                    Portal field is nominal. Monitoring uplink...
                </div>
            </div>
            <button id="chat-btn"
                class="w-16 h-16 bg-orange-500 rounded-full shadow-[0_0_20px_rgba(255,153,51,0.5)] hover:scale-110 transition text-white">
                <i class="fas fa-robot text-2xl"></i>
            </button>
        </div>
    </div>
    <script src="script.js" defer></script>


</body>

</html>
